name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, per GitHub's "Security hardening for GitHub Actions". This job only
# reads: it installs, lints, checks the committed artifacts, re-derives the README's
# numbers from the result files and regenerates the figures. It publishes nothing.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Observed runs finish in about 40 seconds. A cap stops a hung install or a stalled
    # wheel download holding a runner for the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The two archives are 2.4 GB together. Nothing checked here needs them:
          # the Exercise 3 summaries they contain are committed under
          # results/exercise3_rope/. Fetching them would spend the LFS bandwidth
          # quota on every run for no benefit.
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # ruff is pinned. Installed unpinned, a lint result depends on the day the job
        # ran: an upstream release that adds a rule turns this build red with no change
        # to the code, and a check that fails for reasons outside the repository is a
        # check people learn to ignore. Raise this deliberately and fix what the new
        # version finds in the same commit.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff==0.17.2"

      - name: Lint the scripts
        # Only scripts/, which is ours. code/ holds the assignment scripts as
        # submitted and is deliberately left as it was written.
        run: ruff check scripts/

      # Also checks that each committed figure records the result files it was
      # drawn from and that those files are still the committed ones, which is
      # why it runs before the step that regenerates the figures: afterwards it
      # would be checking this runner's own output.
      - name: Artifacts present, code parses, figures match results/
        run: python scripts/check_repository.py

      - name: README numbers still match the result files
        run: python scripts/check_claims.py

      - name: Figures regenerate
        run: python scripts/figures/generate_figures.py

      - name: Workflow diagrams regenerate identically
        # Both themes. The step used to name only workflow.svg, so a dark variant could
        # have drifted from the numbers in results/ without anything noticing.
        run: |
          python scripts/figures/generate_diagram.py
          git diff --exit-code -- docs/diagrams/workflow.svg docs/diagrams/workflow-dark.svg
